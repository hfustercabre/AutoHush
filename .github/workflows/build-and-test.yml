# Builds AutoHush with warnings as errors and runs its tests on every pull
# request into dev, as CONTRIBUTING.md asks of each change, and on every push
# to dev and v1-prerelease, then builds AutoHush.app with
# Scripts/build-app.sh. It reads the code and nothing else: no secrets, no
# writing, so a fork's pull request runs it as it is.
name: Build and test

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, v1-prerelease]

permissions:
  contents: read

# A new push to the pull request, or to the branch, stops the run for the one before.
concurrency:
  group: build-and-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # Xcode 27 and the macOS 27 SDK, which the app is built with (Liquid
    # Glass, macOS 27's menu images). GitHub still calls the image a preview.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        run: xcodebuild -version && swift --version
      - name: Build everything, warnings as errors (Package.swift)
        run: swift build
      - name: Test
        # Without the slow disk image tests; a release runs them all. The
        # runner is several times slower than a Mac: the tests' waits get
        # 90 s instead of 30 s (TestWait).
        env:
          AUTOHUSH_QUICK_TESTS: "1"
          AUTOHUSH_TEST_WAIT: "90"
        run: swift test
      - name: Build the app
        # A debug build signed ad hoc (there's no signing identity here), to
        # check what only build-app.sh does: the helper copied into the app
        # and signed, the App Intents metadata, the icon and the string
        # catalog's sync, whose skip ("no string list for …") is only a
        # warning in the script.
        env:
          SIGNING_IDENTITY: "-"
          KEEP_PERMISSIONS: "1"
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/build-app.sh debug | tee "$RUNNER_TEMP/build-app.log"
          if grep -F "no string list" "$RUNNER_TEMP/build-app.log"; then
            echo "::error::build-app.sh skipped the string catalog's sync (no string list for a source, above: two Swift files may share a name)"
            exit 1
          fi
          test -x AutoHush.app/Contents/Helpers/playercheck || { echo "::error::AutoHush.app has no Contents/Helpers/playercheck"; exit 1; }
