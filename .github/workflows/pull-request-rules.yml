# Checks that a pull request follows CONTRIBUTING.md: it goes into dev, from
# a branch named as Conventional Branch (conventionalbranch.org) asks, of the
# types contributors use: feature/…, fix/… or chore/…, then lowercase words
# and numbers joined by single hyphens (dots for versions). Runs again when
# the pull request is edited (a new target), so fixing it clears the check.
name: Pull request rules

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# Reads nothing and writes nothing: the branch names come with the event.
permissions: {}

jobs:
  branches:
    name: Branch name and target
    runs-on: ubuntu-latest
    steps:
      - name: Check the branches
        # Through the environment, never written into the script: a branch
        # name is chosen by whoever opens the pull request.
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          problems=0
          if [ "$BASE_BRANCH" != "dev" ]; then
            echo "::error title=Target::Open the pull request into dev (see CONTRIBUTING.md)."
            problems=1
          fi
          segment='[a-z0-9]+(\.[a-z0-9]+)*'
          if ! printf '%s\n' "$HEAD_BRANCH" | grep -Eqx "(feature|fix|chore)/$segment(-$segment)*"; then
            echo "::error title=Branch name::Name the branch feature/…, fix/… or chore/…, in lowercase words joined by hyphens, e.g. fix/vlc-resume (see CONTRIBUTING.md)."
            problems=1
          fi
          if [ "$problems" = 0 ]; then
            echo "Into dev, from a branch named as CONTRIBUTING.md asks."
          fi
          exit "$problems"
