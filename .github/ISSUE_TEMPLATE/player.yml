name: A player to support
description: An app you'd like AutoHush to pause and resume.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        AutoHush works with Spotify, Apple Music, VLC, Apple Podcasts and TIDAL, with any website added to the Dock from Safari, and with other apps you add yourself: choose **Add an App…** among the media players, and AutoHush checks how it can pause and play the app. If the check finds no way, paste its log below: it's the newest file in `~/Library/Logs/AutoHush/Checks`.
  - type: input
    id: app
    attributes:
      label: The app
      description: Its name, and where to get it.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: The check's log
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: For example, how you use the app, or whether it has a web player.
