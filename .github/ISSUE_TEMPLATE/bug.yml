name: Bug report
description: AutoHush doesn't do what it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting it. The more of this you fill in, the sooner it can be fixed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, and what AutoHush did. For example, "Safari played a video and Spotify didn't pause."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AutoHush version
      description: In Settings → About.
      placeholder: "0.12.1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: In the Apple menu → About This Mac.
      placeholder: "macOS 26.1"
    validations:
      required: true
  - type: dropdown
    id: player
    attributes:
      label: Your media player
      options:
        - Spotify
        - Apple Music
        - VLC
        - Apple Podcasts
        - TIDAL
        - QuickTime Player
        - An app added with Add an App… (say which below)
        - A Safari web app (say which below)
        - None chosen
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In Settings → Diagnostics, click Copy Report and paste it here. It lists AutoHush's settings and permissions, your player's state and the apps that played sound lately; remove anything you'd rather not share.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: In Settings → Diagnostics, click Show Logs…, then Copy Logs, and paste them here (This Launch, or Last 24 Hours if it happened before AutoHush last opened). They list each pause and resume of your player and why, with the apps that played, and each change to AutoHush's settings, private details left out; remove any app's name you'd rather not share.
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Which web app or added app, how often it happens, screenshots.
